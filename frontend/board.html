<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bảng Kanban - Task Manager</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header id="topbar"></header>
  <main class="container">
    <a href="dashboard.html" class="small">← Quay lại bảng điều khiển</a>
    <div class="page-head" style="margin-top:8px">
      <div>
        <h1 id="p-name" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">Đang tải...</h1>
        <div class="muted" id="p-desc"></div>
      </div>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn" id="btn-members">👥 Thành viên</button>
        <button class="btn primary" id="btn-add">＋ Thêm task</button>
      </div>
    </div>

    <div class="toolbar">
      <div class="field"><input id="f-q" type="search" placeholder="🔍 Tìm theo tên, mô tả..."></div>
      <div class="field">
        <select id="f-priority">
          <option value="">Mọi mức ưu tiên</option>
          <option value="urgent">Khẩn cấp</option><option value="high">Cao</option>
          <option value="medium">Trung bình</option><option value="low">Thấp</option>
        </select>
      </div>
      <div class="field"><select id="f-assignee"></select></div>
      <button class="btn sm ghost" id="f-clear">Xóa bộ lọc</button>
      <span class="muted small" id="f-count"></span>
    </div>

    <div class="board" id="board"></div>
  </main>
  <script src="js/api.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/board.js"></script>
</body>
</html>
