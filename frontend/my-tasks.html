<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Việc của tôi - Task Manager</title>
  <link rel="icon" type="image/svg+xml" href="img/favicon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-col">
      <header id="topbar"></header>
      <main class="container">
        <div class="muted page-sub">Mọi công việc được giao cho bạn, trên tất cả dự án.</div>
        <div class="toolbar">
          <div class="field search-field"><i data-icon="search" data-size="18"></i><input id="mt-q" type="search" aria-label="Tìm công việc" placeholder="Tìm theo tên công việc..."></div>
          <div class="field">
            <select id="mt-priority">
              <option value="">Mọi mức ưu tiên</option>
              <option value="urgent">Khẩn cấp</option><option value="high">Cao</option>
              <option value="medium">Trung bình</option><option value="low">Thấp</option>
            </select>
          </div>
          <div class="field"><select id="mt-project"></select></div>
          <button class="btn sm ghost" id="mt-clear">Xóa bộ lọc</button>
        </div>
        <div class="card">
          <div id="mt-tabs"></div>
          <div id="mt-table"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="js/api.js"></script>
  <script src="js/icons-data.js"></script>
  <script src="js/icon.js"></script>
  <script src="js/motion.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/notify.js"></script>
  <script src="js/profile.js"></script>
  <script src="js/my-tasks.js"></script>
</body>
</html>
